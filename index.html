        .room-action-btn:hover {

        /* Затемнение фона при открытом меню */
        .sidebar-overlay {

        }

        .sidebar-overlay.active {
            opacity: 1;
            visibility: visible;
            pointer-events: none;
        }

.main {

        /* Стили сообщений - свои справа, чужие слева */
        .message-wrapper {
            width: 100%;
            display: flex;
            margin-bottom: 8px;
        }

        .message-wrapper.own {
            justify-content: flex-end;
        }

        .message-wrapper.other {
            justify-content: flex-start;

        .message-content {
            display: flex;
            align-items: flex-end;
            gap: 8px;
            max-width: 70%;
        }

        .message-wrapper.own .message-content {
            flex-direction: row-reverse;

        .message {
            padding: 12px 16px;

            word-break: break-word;
            line-height: 1.5;

            font-size: 1rem;

        .message.own {
            background: var(--message-own);
            border-bottom-right-radius: 6px;
            color: white;
        }

        .message.other {
            background: var(--message-other);
            border-bottom-left-radius: 6px;
            border: 1px solid rgba(123, 110, 246, 0.2);
        }

        .message-time {
            font-size: 0.65rem;
            opacity: 0.6;

            display: flex;

            justify-content: flex-end;

        }

        /* Стили для индикатора пользователя */
.user-indicator {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    min-width: 10px;
    margin-right: 6px;

}

.message-wrapper.own .user-indicator {

}

.message-content {

    if (Notification.permission === 'granted') return true;

function triggerIncomingAlert(roomId, msgKey, msg, isLiveEvent = false) {
    if (!msg || msg.from === userId || msg.deleted) return;
    if (notifiedMessageKeys.has(msgKey)) return;

        const msgKey = snap.key;
        const msg = snap.val();
        if (!msg || msg.deleted) return;

        const msgTs = msg.ts || 0;
        const prevMaxTs = latestSeenTsByRoom.get(roomId) || 0;

    query.on('child_removed', onChildRemoved);

        onChildAdded,
        onChildChanged,
        onChildRemoved
    });

function formatMenuTime(ts) {
    if (!ts) return '';
    const date = new Date(ts);
    const now = new Date();

    const timeStr = date.toLocaleTimeString([], {
        hour: '2-digit',
        minute: '2-digit'
    });

    const isToday =
        date.getDate() === now.getDate() &&
        date.getMonth() === now.getMonth() &&
        date.getFullYear() === now.getFullYear();

    if (isToday) {
        return timeStr; // Например: 22:30
    }

    const dateStr = date.toLocaleDateString([], {
        day: '2-digit',
        month: '2-digit'
    });

    return `${dateStr}/${timeStr}`; // Например: 21.11 22:30
}

async function updateMenuLastMessagePreview(roomId, msg) {
    const roomItem = document.querySelector(`.room-item[data-room-id="${roomId}"]`);
    if (!roomItem) return;

    const lastMsgEl = roomItem.querySelector('.room-last-message');
    const timeEl = roomItem.querySelector('.room-time');
    const room = rooms.get(roomId);

    if (!msg || !msg.data || msg.deleted === true) {
        if (lastMsgEl) lastMsgEl.textContent = 'Нет сообщений';
        return;
    }

    if (timeEl && msg.ts) {
        timeEl.textContent = formatMenuTime(msg.ts);
    }

    if (!lastMsgEl) return;

    if (!room || !room.keyBase64) {
        lastMsgEl.textContent = '🔐 Зашифровано';
        return;
    }

    try {
        if (!room._menuCryptoKey) {
            room._menuCryptoKey = await importKey(room.keyBase64);
        }
        const decrypted = await decryptMessage(msg.data, room._menuCryptoKey);
        const prefix = msg.from === userId ? 'Вы: ' : '';
        const cleanText = (prefix + decrypted).replace(/\s+/g, ' ').trim();
        lastMsgEl.textContent = cleanText.length > 32
            ? cleanText.substring(0, 32) + '...'
            : cleanText;
    } catch (e) {
        lastMsgEl.textContent = '🔐 Сообщение не может быть расшифровано';
    }
}

function attachMenuLastMessageListener(roomId) {
    if (!rooms.has(roomId)) return;

    detachMenuLastMessageListener(roomId);

    const query = db.ref(`rooms/${roomId}/messages`).orderByChild('ts').limitToLast(1);

    const applySnapshot = async (snapshot) => {
        let lastMsg = null;
        if (snapshot && snapshot.exists()) {
            snapshot.forEach((childSnap) => {
                lastMsg = childSnap.val();
            });
        }

        renderMenuLastMessageBadge(roomId, lastMsg);
        await updateMenuLastMessagePreview(roomId, lastMsg);
    };

    const onValue = (snapshot) => {
        applySnapshot(snapshot);
    };

    const onChildChanged = (snapshot) => {
        applySnapshot(snapshot);
    };

    const onChildRemoved = () => {
        query.once('value').then((snap) => applySnapshot(snap));
    };

    const onError = (error) => {
        console.error(`[MENU-ERR ${roomId}]`, error);
    };

    query.on('value', onValue, onError);
    query.on('child_changed', onChildChanged, onError);
    query.on('child_removed', onChildRemoved, onError);

    menuLastMsgListeners.set(roomId, {
        query,
        onValue,
        onChildChanged,
        onChildRemoved
    });
}

function detachMenuLastMessageListener(roomId) {
    const entry = menuLastMsgListeners.get(roomId);
    if (entry) {
        entry.query.off('value', entry.onValue);
        entry.query.off('child_changed', entry.onChildChanged);
        entry.query.off('child_removed', entry.onChildRemoved);
        menuLastMsgListeners.delete(roomId);
    }
}

function getUserColor(userId) {
    let hash = 0;
    for (let i = 0; i < userId.length; i++) {
        hash = ((hash << 5) - hash) + userId.charCodeAt(i);
        hash = hash & hash;
    }
    
    // Hue (оттенок) - 0-360, берем из хеша
    const hue = Math.abs(hash) % 360;
    
    // Saturation (насыщенность) - 65-85%, яркие цвета
    const saturation = 65 + (Math.abs(hash * 13) % 21);
    
    // Lightness (яркость) - 55-70%, хорошо видно на темном фоне
    const lightness = 55 + (Math.abs(hash * 17) % 16);
    
    return `hsl(${hue}, ${saturation}%, ${lightness}%)`;
}

            // Crypto functions
            async function generateCryptoKey() {
                const key = await window.crypto.subtle.generateKey(
                    { name: "AES-GCM", length: 256 },
                    true,
                    ["encrypt", "decrypt"]
                );
                const exported = await window.crypto.subtle.exportKey("raw", key);
                const keyBase64 = btoa(String.fromCharCode(...new Uint8Array(exported)));
                return { key, keyBase64 };
            }

            async function importKey(keyBase64) {
                const binaryStr = atob(keyBase64);
                const bytes = new Uint8Array(binaryStr.length);
                for (let i = 0; i < binaryStr.length; i++) {
                    bytes[i] = binaryStr.charCodeAt(i);
                }
                return await window.crypto.subtle.importKey(
                    "raw",
                    bytes,
                    { name: "AES-GCM", length: 256 },
                    true,
                    ["encrypt", "decrypt"]
                );
            }

            async function encryptMessage(text, key) {
                const encoder = new TextEncoder();
                const iv = window.crypto.getRandomValues(new Uint8Array(12));
                const encoded = encoder.encode(text);
                const ciphertext = await window.crypto.subtle.encrypt(
                    { name: "AES-GCM", iv },
                    key,
                    encoded
                );
                const combined = new Uint8Array(iv.length + new Uint8Array(ciphertext).length);
                combined.set(iv);
                combined.set(new Uint8Array(ciphertext), iv.length);
                return btoa(String.fromCharCode(...combined));
            }

            async function decryptMessage(encryptedBase64, key) {
                try {
                    const combined = Uint8Array.from(atob(encryptedBase64), c => c.charCodeAt(0));
                    const iv = combined.slice(0, 12);
                    const ciphertext = combined.slice(12);
                    const decrypted = await window.crypto.subtle.decrypt(
                        { name: "AES-GCM", iv },
                        key,
                        ciphertext
                    );
                    return new TextDecoder().decode(decrypted);
                } catch (e) {
                    return "🔐 Сообщение не может быть расшифровано";
                }
            }






// ========== ФУНКЦИИ ДЛЯ ПОДСЧЕТА РАЗМЕРА ==========
// Функция для подсчета размера сообщения в байтах
function getMessageSizeInBytes(message) {
    let totalBytes = 0;
    
    // Считаем размер data (зашифрованное сообщение в base64)
    if (message.data) {
        totalBytes += message.data.length * 1.37; // base64 коэффициент
    }
    
    // Метаданные
    if (message.from) totalBytes += message.from.length;
    if (message.ts) totalBytes += 8; // timestamp число ~8 байт
    if (message.delivered !== undefined) totalBytes += 1;
    
    return Math.ceil(totalBytes);
}
// ========== ГЛОБАЛЬНАЯ ОЧИСТКА ПО РАЗМЕРУ ==========
// Глобальная очистка для ВСЕХ комнат (лимит 900 МБ)
async function globalCleanupBySize(maxSizeMB = 900) {
    try {
        const maxSizeBytes = maxSizeMB * 1024 * 1024; // 900 МБ в байтах
        console.log(`🔍 Запуск глобальной очистки... Лимит: ${maxSizeMB} МБ`);
        
        const roomsSnapshot = await db.ref('rooms').once('value');
        
        if (!roomsSnapshot.exists()) {
            console.log('Нет комнат для очистки');
            return;
        }
        
        // Собираем ВСЕ сообщения из ВСЕХ комнат
        const allMessages = [];
        let totalSize = 0;
        
        roomsSnapshot.forEach((roomSnapshot) => {
            const roomId = roomSnapshot.key;
            const messagesSnapshot = roomSnapshot.child('messages');
            
            if (messagesSnapshot.exists()) {
                messagesSnapshot.forEach((msgSnapshot) => {
                    const msg = msgSnapshot.val();
                    const size = getMessageSizeInBytes(msg);
                    
                    allMessages.push({
                        key: msgSnapshot.key,
                        roomId: roomId,
                        timestamp: msg.ts || 0,
                        size: size
                    });
                    
                    totalSize += size;
                });
            }
        });
        
        const totalSizeMB = (totalSize / 1024 / 1024).toFixed(2);
        console.log(`📊 ВСЕГО: ${allMessages.length} сообщений, ${totalSizeMB} МБ`);
        
        // Если превышен глобальный лимит
        if (totalSize > maxSizeBytes) {
            // Сортируем ВСЕ сообщения по времени (от старых к новым)
            allMessages.sort((a, b) => a.timestamp - b.timestamp);
            
            const updates = {};
            let sizeToRemove = totalSize - maxSizeBytes;
            let removedSize = 0;
            let removedCount = 0;
            
            console.log(`⚠️ Превышение на ${(sizeToRemove/1024/1024).toFixed(2)} МБ. Удаляем старые сообщения...`);
            
            // Удаляем самые старые сообщения из любых комнат
            for (const msg of allMessages) {
                if (removedSize >= sizeToRemove) break;
                
                updates[`rooms/${msg.roomId}/messages/${msg.key}`] = null;
                removedSize += msg.size;
                removedCount++;
            }
            
            if (removedCount > 0) {
                await db.ref().update(updates);
                const removedSizeMB = (removedSize/1024/1024).toFixed(2);
                const newTotalMB = ((totalSize - removedSize)/1024/1024).toFixed(2);
                
                console.log(`🧹 Глобальная очистка: удалено ${removedCount} старых сообщений (${removedSizeMB} МБ)`);
                console.log(`📈 Теперь всего: ${newTotalMB} МБ`);
                
                // Показываем уведомление пользователю
                if (typeof showStatus === 'function') {
                    showStatus(`🧹 База данных: ${totalSizeMB} МБ, очищено ${removedCount} сообщений`);
                }
            }
        } else {
            console.log(`✅ Лимит не превышен. Использовано: ${totalSizeMB} МБ из ${maxSizeMB} МБ`);
        }
    } catch (error) {
        console.error('Ошибка глобальной очистки:', error);
    }
}

function enableRoomDragAndDrop(roomEl, roomId) {
    let holdTimer = null;
    let isDragging = false;
    let suppressClick = false;
    let startX = 0;
    let startY = 0;
    let activePointerId = null;

    const clearHoldTimer = () => {
        if (holdTimer) {
            clearTimeout(holdTimer);
            holdTimer = null;
        }
    };

    const cleanupDragVisuals = () => {
        roomEl.classList.remove('dragging');
        roomsListEl.querySelectorAll('.room-item').forEach((el) => {
            el.classList.remove('drag-over-top', 'drag-over-bottom');
        });
    };

    const moveRoomByPointerY = (clientY) => {
        const siblings = [...roomsListEl.querySelectorAll('.room-item')].filter((el) => el !== roomEl);
        siblings.forEach((el) => el.classList.remove('drag-over-top', 'drag-over-bottom'));

        if (siblings.length === 0) return;

        let closestEl = null;
        let closestDistance = Infinity;

        for (const el of siblings) {
            const rect = el.getBoundingClientRect();
            const centerY = rect.top + rect.height / 2;
            const dist = Math.abs(clientY - centerY);
            if (dist < closestDistance) {
                closestDistance = dist;
                closestEl = el;
            }
        }

        if (!closestEl) return;

        const rect = closestEl.getBoundingClientRect();
        const insertBefore = clientY < rect.top + rect.height / 2;
        closestEl.classList.add(insertBefore ? 'drag-over-top' : 'drag-over-bottom');

        if (insertBefore) {
            if (roomEl.nextElementSibling !== closestEl) {
                roomsListEl.insertBefore(roomEl, closestEl);
            }
        } else {
            if (closestEl.nextElementSibling !== roomEl) {
                roomsListEl.insertBefore(roomEl, closestEl.nextElementSibling);
            }
        }
    };

    roomEl.addEventListener('pointerdown', (e) => {
        if (e.target.closest('.room-action-btn')) return;
        if (e.pointerType === 'mouse' && e.button !== 0) return;

        startX = e.clientX;
        startY = e.clientY;
        activePointerId = e.pointerId;

        clearHoldTimer();
        holdTimer = setTimeout(() => {
            isDragging = true;
            suppressClick = true;
            roomEl.classList.add('dragging');
            try {
                roomEl.setPointerCapture(activePointerId);
            } catch (_) {}
        }, 220);
    });

    roomEl.addEventListener('pointermove', (e) => {
        if (!isDragging) {
            if (holdTimer && (Math.abs(e.clientX - startX) > 10 || Math.abs(e.clientY - startY) > 10)) {
                clearHoldTimer();
            }
            return;
        }

        e.preventDefault();
        moveRoomByPointerY(e.clientY);
    });

    const finishPointer = (e) => {
        clearHoldTimer();

        if (!isDragging) {
            activePointerId = null;
            return;
        }

        if (typeof e.clientY === 'number') {
            moveRoomByPointerY(e.clientY);
        }

        isDragging = false;
        cleanupDragVisuals();

        if (activePointerId !== null) {
            try {
                if (roomEl.hasPointerCapture(activePointerId)) {
                    roomEl.releasePointerCapture(activePointerId);
                }
            } catch (_) {}
            activePointerId = null;
        }

        saveRoomsOrderFromDOM();

        setTimeout(() => {
            suppressClick = false;
        }, 80);
    };

    roomEl.addEventListener('pointerup', finishPointer);
    roomEl.addEventListener('pointercancel', finishPointer);

    roomEl.addEventListener('click', (e) => {
        if (suppressClick) {
            e.stopPropagation();
            e.preventDefault();
            suppressClick = false;
        }
    }, true);
}

async function markMessagesAsDelivered(roomId) {
    if (!roomId) return;
    
    try {
       
        
        const presenceSnap = await db.ref(`rooms/${roomId}/presence`).once('value');
        
        let anyoneOnline = false;
        const onlineUserIds = new Set();
        
        if (presenceSnap.exists()) {
            const users = presenceSnap.val() || {};
            Object.entries(users).forEach(([id, data]) => {
                if (data && data.online === true) {
                    onlineUserIds.add(id);
                    anyoneOnline = true;
                }
            });
        }
        
       
        
        if (!anyoneOnline) {
            
            return;
        }
        
        const messagesSnap = await db.ref(`rooms/${roomId}/messages`).once('value');
        
        if (messagesSnap.exists()) {
            const updates = {};
            let hasUpdates = false;
            let markedCount = 0;
            
            messagesSnap.forEach((childSnapshot) => {
                const msg = childSnapshot.val();
                const messageId = childSnapshot.key;
                
                if (msg.delivered !== true && !msg.deleted && msg.from !== userId) {
                    updates[`rooms/${roomId}/messages/${messageId}/delivered`] = true;
                    hasUpdates = true;
                    markedCount++;
                  
                }
            });
            
            if (hasUpdates) {
                await db.ref().update(updates);
                
                
                // Обновляем индикаторы после пометки сообщений
                updateRoomMessageIndicators(roomId);
                
                if (typeof showStatus === 'function' && markedCount > 0) {
                    showStatus(`📬 ${markedCount} сообщений доставлено`);
                }
                
                if (currentRoomId === roomId && cryptoKey) {
                    
                    
                    const scrollPos = messagesContainer.scrollTop;
                    const scrollHeight = messagesContainer.scrollHeight;
                    
                    messagesContainer.innerHTML = '';
                    await loadMessages(roomId, cryptoKey);
                    
                    messagesContainer.scrollTop = messagesContainer.scrollHeight - scrollHeight + scrollPos;
                }
            }
        }
    } catch (error) {

    }
}

async function loadMessages(roomId, key, loadMore = false) {
    try {
        if (isLoadingMore) return;
        
        if (!loadMore) {
            messagesContainer.innerHTML = '';
            currentLastTimestamp = null;
            hasMoreMessages = true;
            allMessagesLoaded = false;
            
            if (loadMoreButton) {
                loadMoreButton.remove();
                loadMoreButton = null;
            }
        }
        
        isLoadingMore = true;
        
        // Строим запрос
        let query = db.ref(`rooms/${roomId}/messages`).orderByChild('ts').limitToLast(30);
        
        if (loadMore && currentLastTimestamp) {
            query = db.ref(`rooms/${roomId}/messages`)
                .orderByChild('ts')
                .endAt(currentLastTimestamp - 1)
                .limitToLast(30);
        }
        
        const snapshot = await query.once('value');
        
        if (!snapshot || !snapshot.exists()) {
            hasMoreMessages = false;
            allMessagesLoaded = true;
            isLoadingMore = false;
            
            if (loadMoreButton) {
                loadMoreButton.remove();
                loadMoreButton = null;
            }
            return;
        }
        
        const messagesArray = [];
        snapshot.forEach((childSnapshot) => {
            const msg = childSnapshot.val();
            if (msg && msg.data && !msg.deleted) {
                messagesArray.push({
                    id: childSnapshot.key,
                    ...msg
                });
            }
        });
        
        // Сортируем по времени (от старых к новым)
        messagesArray.sort((a, b) => (a.ts || 0) - (b.ts || 0));
        
        // Сохраняем timestamp самого старого загруженного сообщения
        if (messagesArray.length > 0 && !loadMore) {
            currentLastTimestamp = messagesArray[0].ts;
        } else if (messagesArray.length > 0 && loadMore) {
            currentLastTimestamp = messagesArray[0].ts;
        }
        
        // Проверяем, есть ли ещё старые сообщения
        if (currentLastTimestamp) {
            const checkQuery = await db.ref(`rooms/${roomId}/messages`)
                .orderByChild('ts')
                .endAt(currentLastTimestamp - 1)
                .limitToLast(1)
                .once('value');
            
            hasMoreMessages = checkQuery.exists() && checkQuery.numChildren() > 0;
            allMessagesLoaded = !hasMoreMessages;
            
            
        } else {
            hasMoreMessages = false;
            allMessagesLoaded = true;
        }
        
        // Сохраняем состояние
        roomsState.set(roomId, {
            lastTimestamp: currentLastTimestamp,
            hasMore: hasMoreMessages,
            allLoaded: allMessagesLoaded
        });
        
        // Добавляем сообщения в UI
        if (loadMore) {
            // ПОДГРУЗКА СТАРЫХ СООБЩЕНИЙ
            // Сохраняем позицию скролла
            const oldScrollHeight = messagesContainer.scrollHeight;
            const oldScrollTop = messagesContainer.scrollTop;
            
            // ВАЖНО: Добавляем сообщения в ПРАВИЛЬНОМ порядке (от старых к новым)
            // messagesArray уже отсортирован от старых к новым
            // Добавляем их по порядку в начало контейнера
            for (let i = 0; i < messagesArray.length; i++) {
                const msg = messagesArray[i];
                const decrypted = await decryptMessage(msg.data, key);
                const isOwn = msg.from === userId;
                const messageElement = createMessageElement(
                    decrypted, isOwn, msg.ts, msg.delivered || false,
                    msg.id, msg.from, msg
                );
                
                // Вставляем перед кнопкой загрузки или в начало
                if (loadMoreButton && messagesContainer.contains(loadMoreButton)) {
                    messagesContainer.insertBefore(messageElement, loadMoreButton);
                } else {
                    messagesContainer.insertBefore(messageElement, messagesContainer.firstChild);
                }
            }
            
            // Восстанавливаем прокрутку
            const newScrollHeight = messagesContainer.scrollHeight;
            const heightDiff = newScrollHeight - oldScrollHeight;
            messagesContainer.scrollTop = oldScrollTop + heightDiff;
            
        } else {
            // ПЕРВАЯ ЗАГРУЗКА - добавляем в конец
            for (const msg of messagesArray) {
                const decrypted = await decryptMessage(msg.data, key);
                const isOwn = msg.from === userId;
                addMessageToUI(decrypted, isOwn, msg.ts, msg.delivered || false, msg.id, msg.from, msg);
            }
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }
        
        // Управляем кнопкой
        
        
        if (hasMoreMessages && !allMessagesLoaded) {
            if (!loadMoreButton) {
                
                addLoadMoreButton();
            } else {
                ;
                loadMoreButton.style.display = 'flex';
            }
        } else {
            if (loadMoreButton) {
                
                loadMoreButton.remove();
                loadMoreButton = null;
            }
        }
        
        isLoadingMore = false;
        
    } catch (error) {
        console.error('Error loading messages:', error);
        isLoadingMore = false;
    }
}

function setupMessagesListener(roomId, key) {
    detachCurrentMessagesListener();
    messagesRef = db.ref(`rooms/${roomId}/messages`);
    const listenerStartedAt = Date.now();

    messagesAddedHandler = async (snapshot) => {
        if (!snapshot || !snapshot.exists()) return;

        const msg = snapshot.val();
        if (!msg || !msg.data || msg.deleted) return;

        const existingMessage = document.querySelector(`[data-message-id="${snapshot.key}"]`);
        if (existingMessage) return;

        const isOwn = msg.from === userId;
        const decrypted = await decryptMessage(msg.data, key);

        if (!currentLastTimestamp || msg.ts > currentLastTimestamp) {
            addMessageToUI(decrypted, isOwn, msg.ts, msg.delivered || false, snapshot.key, msg.from, msg);

            if (!isOwn && (msg.ts || 0) >= listenerStartedAt - 2000) {
                triggerIncomingAlert(roomId, snapshot.key, msg, true);
            }
        } else {
            return;
        }

        if (!isOwn && !msg.delivered) {
            const updates = {};
            updates[`rooms/${roomId}/messages/${snapshot.key}/delivered`] = true;
            await db.ref().update(updates);
        }

        updateRoomMessageIndicators(roomId);

        const roomItem = document.querySelector(`.room-item[data-room-id="${roomId}"] .room-last-message`);
        const roomTime = document.querySelector(`.room-item[data-room-id="${roomId}"] .room-time`);
        if (roomItem) {
            roomItem.textContent = decrypted.substring(0, 30) + (decrypted.length > 30 ? '...' : '');
        }
        if (roomTime) {
            roomTime.textContent = new Date(msg.ts).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        }

        setTimeout(() => {
            checkAndShowLoadMoreButton();
        }, 100);

        if (loadMoreButton && messagesContainer.scrollTop > 100) {
            loadMoreButton.style.display = 'none';
        }
    };

    messagesChangedHandler = (snapshot) => {
        if (!snapshot || !snapshot.exists()) return;

        const msg = snapshot.val();

        updateRoomMessageIndicators(roomId);

        if (msg && msg.delivered === true) {
            const messageElement = document.querySelector(`[data-message-id="${snapshot.key}"]`);
            if (messageElement) {
                const statusBadge = messageElement.querySelector('.delivery-status-badge');
                if (statusBadge) {
                    statusBadge.innerHTML = ' <i class="fas fa-check-circle delivered" title="Доставлено"></i>';
                }
            }
        }

if (msg && msg.deleted) {
            revokeIncomingAlert(snapshot.key);
            const messageElement = document.querySelector(`[data-message-id="${snapshot.key}"]`);
            if (messageElement) {
                messageElement.closest('.message-wrapper').remove();
            }
        }
    };

    messagesRemovedHandler = (snapshot) => {
        if (snapshot && snapshot.key) {
            revokeIncomingAlert(snapshot.key);
        }
        updateRoomMessageIndicators(roomId);
    };

    currentMessagesListener = messagesAddedHandler;

    messagesRef.on('child_added', messagesAddedHandler);
    messagesRef.on('child_changed', messagesChangedHandler);
    messagesRef.on('child_removed', messagesRemovedHandler);
}

// ========== ФУНКЦИЯ СОЗДАНИЯ ЭЛЕМЕНТА СООБЩЕНИЯ ==========
// Эта функция только создаёт DOM-элемент сообщения, но НЕ добавляет его на страницу
function createMessageElement(text, isOwn, timestamp, isDelivered, messageId, messageFrom, msgData) {
    // Создаём обёртку сообщения (своё справа, чужое слева)
    const wrapper = document.createElement('div');
    wrapper.className = `message-wrapper ${isOwn ? 'own' : 'other'}`;
    
    // Контейнер для содержимого сообщения
    const contentDiv = document.createElement('div');
    contentDiv.className = 'message-content';
    
    // ----- ИНДИКАТОР ПОЛЬЗОВАТЕЛЯ (только для чужих сообщений) -----
    if (!isOwn && messageFrom) {
        const userIndicator = document.createElement('div');
        userIndicator.className = 'user-indicator';
        userIndicator.style.backgroundColor = getUserColor(messageFrom);
        userIndicator.title = `Пользователь: ${messageFrom.substring(0, 8)}...`;
        contentDiv.appendChild(userIndicator);
    }
    
    // ----- ОСНОВНОЙ БЛОК СООБЩЕНИЯ -----
    const msgEl = document.createElement('div');
    msgEl.className = `message ${isOwn ? 'own' : 'other'}`;
    msgEl.textContent = text;
    if (messageId) {
        msgEl.dataset.messageId = messageId;
    }
    
    // ----- ЦИТАТА (если это ответ на другое сообщение) -----
    if (msgData && msgData.replyTo) {
        const replyQuote = document.createElement('div');
        replyQuote.className = 'reply-quote';
        
        const replyAuthorSpan = document.createElement('div');
        replyAuthorSpan.className = 'reply-quote-author';
        
        // Определяем, кому принадлежит цитируемое сообщение
        const isReplyToOwn = msgData.replyTo.from === userId;
        let replyAuthorText;
        
        if (isReplyToOwn) {
            replyAuthorText = 'себя';
            replyAuthorSpan.style.color = '#ffffff'; // белый для цитаты себя
        } else {
            replyAuthorText = 'пользователя';
            const userColor = getUserColor(msgData.replyTo.from);
            replyAuthorSpan.style.color = userColor; // цвет пользователя
        }
        
        replyAuthorSpan.innerHTML = `<i class="fas fa-reply"></i> ${replyAuthorText}`;
        replyAuthorSpan.style.fontWeight = '500';
        
        const replyTextSpan = document.createElement('div');
        replyTextSpan.className = 'reply-quote-text';
        replyTextSpan.textContent = msgData.replyTo.text;
        
        replyQuote.appendChild(replyAuthorSpan);
        replyQuote.appendChild(replyTextSpan);
        
        // Вставляем цитату в начало сообщения
        msgEl.insertBefore(replyQuote, msgEl.firstChild);
    }
    
    // ----- ВРЕМЯ СООБЩЕНИЯ -----
    const timeEl = document.createElement('div');
    timeEl.className = 'message-time';
    
    const timeText = new Date(timestamp).toLocaleString([], { 
        hour: '2-digit', 
        minute: '2-digit',
        day: 'numeric',
        month: 'numeric'
    });
    
    timeEl.textContent = timeText;
    
    // ----- СТАТУС ДОСТАВКИ (только для своих сообщений) -----
    if (isOwn) {
        const statusSpan = document.createElement('span');
        statusSpan.className = 'delivery-status-badge';
        
        if (isDelivered) {
            statusSpan.innerHTML = ' <i class="fas fa-check-circle delivered" title="Доставлено"></i>';
        } else {
            statusSpan.innerHTML = ' <i class="fas fa-clock pending" title="Ожидает доставки"></i>';
        }
        
        timeEl.appendChild(statusSpan);
    }
    
    msgEl.appendChild(timeEl);
    contentDiv.appendChild(msgEl);
    
    // ----- КНОПКИ ДЕЙСТВИЙ -----
    const actionsContainer = document.createElement('div');
    actionsContainer.style.display = 'flex';
    actionsContainer.style.gap = '4px';
    
    // Кнопка "Ответить" (для всех сообщений)
    const replyBtn = document.createElement('button');
    replyBtn.className = 'reply-message-btn';
    replyBtn.innerHTML = '<i class="fas fa-reply"></i>';
    replyBtn.title = 'Ответить';
    
    replyBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        setReplyTo(messageId, text, messageFrom);
    });
    
    actionsContainer.appendChild(replyBtn);
    
    // Кнопка "Удалить" (только для своих сообщений)
    if (isOwn && messageId) {
        const deleteBtn = document.createElement('button');
        deleteBtn.className = 'delete-message-btn';
        deleteBtn.innerHTML = '<i class="fas fa-trash"></i>';
        deleteBtn.title = 'Удалить сообщение';
        
        deleteBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            showConfirm(
                'Удалить сообщение?',
                'Вы уверены, что хотите удалить это сообщение для всех?',
                () => deleteMessage(messageId)
            );
        });
        
        actionsContainer.appendChild(deleteBtn);
    }
    
    contentDiv.appendChild(actionsContainer);
    wrapper.appendChild(contentDiv);
    
    // Возвращаем готовый элемент (НО НЕ ДОБАВЛЯЕМ ЕГО НА СТРАНИЦУ!)
    return wrapper;
}

// ========== ФУНКЦИЯ ДОБАВЛЕНИЯ СООБЩЕНИЯ В ИНТЕРФЕЙС ==========
// Эта функция создаёт сообщение и добавляет его в КОНЕЦ контейнера
function addMessageToUI(text, isOwn, timestamp, isDelivered, messageId, messageFrom, msgData) {
    const messageElement = createMessageElement(text, isOwn, timestamp, isDelivered, messageId, messageFrom, msgData);
    messagesContainer.appendChild(messageElement);
    
    // Скроллим вниз только если это НОВОЕ сообщение (не при загрузке истории)
    const isNewMessage = timestamp > (currentLastTimestamp || 0);
    if (isNewMessage) {
        messagesContainer.scrollTop = messagesContainer.scrollHeight;
    }
}
function addMessageToUIBeginning(text, isOwn, timestamp, isDelivered, messageId, messageFrom, msgData) {
    const messageElement = createMessageElement(text, isOwn, timestamp, isDelivered, messageId, messageFrom, msgData);
    
    // Если есть кнопка "Загрузить ещё" - вставляем перед ней
    if (loadMoreButton && messagesContainer.contains(loadMoreButton)) {
        messagesContainer.insertBefore(messageElement, loadMoreButton);
    } else {
        // Иначе вставляем в самое начало
        messagesContainer.insertBefore(messageElement, messagesContainer.firstChild);
    }
}

function setupGlobalPresence() {
    myGlobalPresenceRef = db.ref(`presence/${userId}`); // На основе твоего скриншота, ветка называется 'presence'
    globalPresenceRef = db.ref('presence');

    // Listen to connection state
    connectedRef = db.ref('.info/connected');
    connectedRef.on('value', (snap) => {
        if (snap && snap.val() === true) {
            // We're connected, set up presence
            myGlobalPresenceRef.onDisconnect().remove();
            myGlobalPresenceRef.set({
                online: true,
                lastSeen: Date.now(),
                currentRoom: currentRoomId || null
            }).catch(error => console.error('Error setting presence:', error));
        }
    });


const onlineCountEl = document.getElementById('onlineCount');
    // Count total and online users with immediate updates
globalPresenceRef.on('value', (snapshot) => {
        if (!onlineCountEl) return;

        if (snapshot && snapshot.exists()) {
            const users = snapshot.val() || {};
            const onlineUsers = Object.values(users).filter(u => u && u.online === true).length;
            onlineCountEl.textContent = onlineUsers;
        } else {
            onlineCountEl.textContent = '0';
        }
    }, (error) => {
        console.error('Error in global presence:', error);
    });


    // =========================================================================
    // ДОБАВЛЯЕМ СЮДА: Глобальный слушатель статусов для боковой панели комнат
    // =========================================================================
    globalPresenceRef.on('value', (snapshot) => {
        if (!snapshot || !snapshot.exists()) {
            // Если ветка пуста, сбрасываем все комнаты в оффлайн (кроме текущей)
            if (rooms && rooms.forEach) {
                rooms.forEach((_, roomId) => {
                    if (roomId !== currentRoomId && typeof updateRoomOnlineStatus === 'function') {
                        updateRoomOnlineStatus(roomId, false);
                    }
                });
            }
            return;
        }

        const allStatuses = snapshot.val();
        
        // Карта для подсчета: roomId -> сколько ДРУГИХ пользователей сейчас там онлайн
        const roomPeersCount = new Map();

        // Пробегаемся по всем записям пользователей из глобальной ветки presence
        Object.entries(allStatuses).forEach(([uid, userData]) => {
            // Обязательно пропускаем себя! Нам важно присутствие именно ДРУГИХ людей
            if (uid === userId) return;

            // Если пользователь онлайн и у него заполнена комната
            if (userData && userData.online === true && userData.currentRoom) {
                const rId = userData.currentRoom;
                roomPeersCount.set(rId, (roomPeersCount.get(rId) || 0) + 1);
            }
        });

        // Обновляем индикаторы в боковой панели
        if (rooms && rooms.forEach) {
            rooms.forEach((_, roomId) => {
                // Текущую активную комнату, в которой ты сидишь, не трогаем!
                if (roomId === currentRoomId) return;

                // Если в этой комнате есть хотя бы один другой онлайн-пользователь
                const activePeers = roomPeersCount.get(roomId) || 0;
                const isAnyPeerOnline = activePeers > 0;

                // Вызываем твою стандартную функцию отрисовки статуса в UI
                if (typeof updateRoomOnlineStatus === 'function') {
                    updateRoomOnlineStatus(roomId, isAnyPeerOnline);
                }
            });
        }
    }, (error) => {
        console.error("Ошибка при чтении статусов для боковой панели:", error);
    });
} // <-- Конец функции setupGlobalPresence
// Room presence setup with immediate updates
function setupRoomPresence(roomId) {
    if (!roomId) return;
    
    try {
        // Сначала удаляем старое присутствие из этой комнаты
        db.ref(`rooms/${roomId}/presence/${userId}`).remove()
            .then(() => {
                // Теперь устанавливаем новое
                const myRoomPresenceRef = db.ref(`rooms/${roomId}/presence/${userId}`);
                
                // Set own presence immediately
                myRoomPresenceRef.set({
                    online: true,
                    lastSeen: Date.now(),
                    roomId: roomId
                }).catch(error => console.error('Error setting room presence:', error));
                
                // Set onDisconnect
                myRoomPresenceRef.onDisconnect().remove();
            })
            .catch(error => console.error('Error cleaning old presence:', error));

        // Remove old presence listener if exists
        if (roomPresenceRef) {
            roomPresenceRef.off();
        }
        
        roomPresenceRef = db.ref(`rooms/${roomId}/presence`);

        // Listen to other users in room with immediate updates
        roomPresenceRef.on('value', async (snapshot) => {
            if (snapshot && snapshot.exists()) {
                const users = snapshot.val() || {};
                
                // Получаем всех пользователей в комнате
                const allUsers = Object.entries(users)
                    .map(([id, data]) => ({ id, ...data }))
                    .filter(u => u.online === true);
                
                const onlineCount = allUsers.length;
                
               
                
                // Обновляем статус для этой комнаты
                onlineStatusInRooms.set(roomId, onlineCount > 0);
                
                // ВАЖНО: Если есть хоть кто-то онлайн (включая нас самих)
                if (onlineCount > 0) {
                    
                    
                    // Помечаем сообщения как доставленные
                    await markMessagesAsDelivered(roomId);
                }
                
                // Update UI immediately
                roomOnlineCount.textContent = onlineCount;
                
                // Update peer status (показываем есть ли кто-то кроме нас)
                const otherOnlineCount = allUsers.filter(u => u.id !== userId).length;
                if (otherOnlineCount > 0) {
                    peerStatus.innerHTML = '<i class="fas fa-circle"></i> в сети';
                    peerStatus.className = 'status-badge online';
                } else {
                    peerStatus.innerHTML = '<i class="fas fa-circle"></i> не в сети';
                    peerStatus.className = 'status-badge offline';
                }
                
                // Update room online indicator
                updateRoomOnlineStatus(roomId, otherOnlineCount > 0);
                
                // Update global presence with current room
                if (myGlobalPresenceRef) {
                    myGlobalPresenceRef.update({ currentRoom: roomId })
                        .catch(error => console.error('Error updating global presence:', error));
                }
            } else {
               
                roomOnlineCount.textContent = '0';
                onlineStatusInRooms.set(roomId, false);
                peerStatus.innerHTML = '<i class="fas fa-circle"></i> не в сети';
                peerStatus.className = 'status-badge offline';
                updateRoomOnlineStatus(roomId, false);
            }
        }, (error) => {
            console.error('Error in room presence:', error);
        });
        
    } catch (error) {
        console.error('Error setting up room presence:', error);
    }
}

// ========== ФУНКЦИИ ДЛЯ ПАГИНАЦИИ ==========

function addLoadMoreButton() {
    // Дополнительная проверка - если кнопка уже есть или нет сообщений для загрузки
    if (loadMoreButton) return;
    if (!hasMoreMessages || allMessagesLoaded) return;
    
    const container = document.createElement('div');
    container.className = 'load-more-container';
    container.id = 'loadMoreContainer';
    
    const button = document.createElement('button');
    button.className = 'load-more-btn';
    button.innerHTML = '<i class="fas fa-arrow-up"></i> Загрузить предыдущие сообщения';
    
    let isLoading = false;
    
    button.onclick = async () => {
        if (isLoading || isLoadingMore || !hasMoreMessages) return;
        
        isLoading = true;
        button.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Загрузка...';
        button.disabled = true;
        
        const beforeCount = messagesContainer.querySelectorAll('.message-wrapper').length;
        const oldScrollHeight = messagesContainer.scrollHeight;
        const oldScrollTop = messagesContainer.scrollTop;
        
        await loadMessages(currentRoomId, cryptoKey, true);
        
        const afterCount = messagesContainer.querySelectorAll('.message-wrapper').length;
        const loadedCount = afterCount - beforeCount;
        
        console.log(`📊 Загружено ${loadedCount} сообщений. Всего в чате: ${afterCount} сообщений`);
        
        if (loadMoreButton) {
            loadMoreButton.remove();
            loadMoreButton = null;
        }
        
        const newScrollHeight = messagesContainer.scrollHeight;
        const heightDiff = newScrollHeight - oldScrollHeight;
        messagesContainer.scrollTop = oldScrollTop + heightDiff;
        
        if (hasMoreMessages && !allMessagesLoaded) {
            addLoadMoreButton();
        }
        
        isLoading = false;
    };
    
    container.appendChild(button);
    loadMoreButton = container;
    
    if (messagesContainer.firstChild) {
        messagesContainer.insertBefore(container, messagesContainer.firstChild);
    } else {
        messagesContainer.appendChild(container);
    }
}

function setupScrollHandler() {
    let scrollTimeout = null;
    
    messagesContainer.addEventListener('scroll', () => {
        if (scrollTimeout) clearTimeout(scrollTimeout);
        
        scrollTimeout = setTimeout(() => {
            checkAndShowLoadMoreButton();
        }, 150);
    });
}

function checkAndShowLoadMoreButton() {
    
    
    // Проверяем, есть ли ещё сообщения для загрузки
    if (!hasMoreMessages || allMessagesLoaded) {
        
        if (loadMoreButton) {
            loadMoreButton.remove();
            loadMoreButton = null;
        }
        return;
    }
    
    // Проверяем, есть ли вообще сообщения в контейнере
    const messagesCount = messagesContainer.querySelectorAll('.message-wrapper').length;
    if (messagesCount === 0) {
        
        return;
    }
    
    // Проверяем, докрутили ли до верха
    const isAtTop = messagesContainer.scrollTop <= 50;
    
    
    if (isAtTop) {
        // Если кнопки нет - создаём
        if (!loadMoreButton) {
            
            addLoadMoreButton();
        } else {
            // Если кнопка есть, но скрыта - показываем
            
            loadMoreButton.style.display = 'flex';
        }
    } else {
        // Если не наверху - скрываем кнопку, но НЕ УДАЛЯЕМ
        if (loadMoreButton) {
            
            loadMoreButton.style.display = 'none';
        }
    }
}


// ИНИЦИАЛИЗАЦИЯ С ГЛОБАЛЬНОЙ ОЧИСТКОЙ (БЕЗ loadPendingMessages)
async function initialize() {
    try {
        // Загружаем сохраненные комнаты
        const savedRooms = loadSavedRooms();
        
// Добавляем комнаты в интерфейс с учётом сохранённого порядка
        const sortedRooms = Object.entries(savedRooms).sort((a, b) => {
            const orderA = typeof a[1].order === 'number' ? a[1].order : Number.MAX_SAFE_INTEGER;
            const orderB = typeof b[1].order === 'number' ? b[1].order : Number.MAX_SAFE_INTEGER;
            if (orderA !== orderB) return orderA - orderB;
            return (b[1].lastAccessed || 0) - (a[1].lastAccessed || 0);
        });

        for (const [roomId, data] of sortedRooms) {
            addRoomToUI(roomId, data.keyBase64, data.name, 'Сохранено', data.lastAccessed);
        }
        for (const roomId of rooms.keys()) {
            attachBackgroundAlertListener(roomId);
        }
        // Переключаемся на последнюю использованную комнату
        if (Object.keys(savedRooms).length > 0) {
            const lastRoom = Object.entries(savedRooms)
                .sort((a, b) => b[1].lastAccessed - a[1].lastAccessed)[0];
            await switchRoom(lastRoom[0]);
        }
        
        // ========== ГЛОБАЛЬНАЯ ОЧИСТКА ПРИ ЗАПУСКЕ ==========
        // Проверяем, когда была последняя очистка
        const lastGlobalCleanup = localStorage.getItem('global_cleanup_900mb');
        const now = Date.now();
        
        // Очищаем если:
        // 1. Никогда не было очистки
        // 2. Прошло больше 24 часов с последней очистки
        if (!lastGlobalCleanup || now - parseInt(lastGlobalCleanup) > 86400000) { // 24 часа
           
            await globalCleanupBySize(900); // 900 МБ лимит
            localStorage.setItem('global_cleanup_900mb', now.toString());
